# RAG Chatbot Configuration

# Document Processing
chunking:
  strategy: "recursive"  # Options: sliding_window, recursive, semantic
  chunk_size: 512
  chunk_overlap: 128

# Embedding Configuration
embedding:
  model_name: "all-MiniLM-L6-v2"  # Lightweight, good performance
  batch_size: 32
  normalize_embeddings: true
  device: "cpu"

# Indexing Configuration
indexing:
  backend: "faiss"  # Options: faiss, scann
  index_type: "IVFFlat"  # Options: Flat, IVFFlat, IVFPQ
  n_clusters: 100  # For IVF indices
  use_gpu: false

# Retrieval Configuration
retrieval:
  strategy: "hybrid"  # Options: dense, hybrid, rerank
  top_k: 20
  rerank_top_n: 5
  hybrid_alpha: 0.7  # Weight for dense vs BM25 (0.7 means 70% dense)
  similarity_threshold: 0.3

# Reranking Configuration
reranking:
  enabled: true
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  batch_size: 16

# LLM Configuration
llm:
  provider: "groq"
  model_name: "llama-3.1-8b-instant"
  temperature: 0.1
  max_tokens: 1024
  top_p: 0.9
  streaming: false

# Prompt Templates
prompts:
  qa_template: |
    Answer the question based on the following context. If you cannot answer based on the context, say so.
    Cite the source numbers [1], [2], etc. when referencing specific information.
    
    Context:
    {context}
    
    Question: {question}
    
    Answer:
  
  conversational_template: |
    You are a helpful assistant. Use the following context to answer the user's question.
    Be conversational and cite sources when appropriate.
    
    Context:
    {context}
    
    Chat History:
    {chat_history}
    
    User: {question}
    Assistant:

# Evaluation Configuration
evaluation:
  metrics:
    - recall_at_k
    - mrr
    - ndcg
    - exact_match
    - f1_score
  k_values: [1, 5, 10, 20]

# Performance Configuration
performance:
  enable_caching: true
  cache_size: 1000
  log_latency: true
  enable_monitoring: false  # Set to true for wandb logging

# Dataset Configuration
datasets:
  data_dir: "./data/documents"
  processed_dir: "./data/processed"
  index_dir: "./data/indices"
  
# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_file: "./logs/rag_chatbot.log"